name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project structure
        run: |
          mkdir -p app/src/main/java/com/aimruler
          cp app.gradle app/build.gradle
          cp aim.keystore app/aim.keystore
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java OverlayService.java app/src/main/java/com/aimruler/
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aim-ruler-apk
          path: app/build/outputs/apk/debug/*.apk
