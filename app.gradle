plugins { id 'com.android.application' }

// номер сборки из GitHub Actions: растёт с каждым запуском, чтобы Android принимал обновление поверх старой версии
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.aimruler'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aimruler'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName '1.0'
    }
    // Одна и та же подпись при каждой сборке: APK ставится как обновление, без удаления старой версии
    signingConfigs {
        debug {
            storeFile file('aim.keystore')
            storePassword 'aimruler'
            keyAlias 'aim'
            keyPassword 'aimruler'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
