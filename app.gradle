plugins { id 'com.android.application' }
android {
    namespace 'com.aimruler'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aimruler'
        minSdk 24
        targetSdk 34
        // номер версии растёт с каждой сборкой, чтобы Android принимал обновление поверх старой версии
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
    }
    // Одна и та же подпись при каждой сборке: тогда APK ставится как обновление, без удаления старой версии
    signingConfigs {
        debug {
            storeFile file('aim.keystore')
            storePassword 'aimruler'
            keyAlias 'aim'
            keyPassword 'aimruler'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
